<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Curso de Javascript</title>
    <meta charset="UTF-8">
    <style>
        #jogador {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 50px;
            height: 50px;
            background-color: black;
        }

        #jogadordois {
            position: absolute;
            left: 5px;
            top: 5px;
            width: 50px;
            height: 50px;
            background-color: red;
        }
    </style>
    <script>
        var px = 0;
        var py = 0;
        var ppx = 0;
        var ppy = 0;
        function load() {
            document.addEventListener("keydown", tecla)
        }
        function tecla() {
            var jg = document.getElementById("jogador");
            var tecla = event.keyCode;
            if (tecla == 65) {
                //esquerda
                px += 10;
                jg.style.left = px + "px";
            } else if (tecla == 68) {
                //direita
                px -= 10
                jg.style.left = px + "px";
            }
            if (tecla == 87) {
                //cima
                py -= 10;
                jg.style.top = py + "px";

            } else if (tecla == 83) {
                //baixo
                py += 10;
                jg.style.top = py + "px";
            }
        }
        function load2() {
            document.addEventListener("keydown", tecla2)
        }
        function tecla2() {
            var jg = document.getElementById("jogador2");
            var tecla = event.keyCode;
            if (tecla == 37) {
                //esquerda
                ppx += 10;
                jg.style.left = ppx + "ppx";
            } else if (tecla == 39) {
                //direita
                ppx -= 10
                jg.style.left = ppx + "ppx";
            }
            if (tecla == 38) {
                //cima
                ppy -= 10;
                jg.style.top = ppy + "ppx";

            } else if (tecla == 40) {
                //baixo
                ppy += 10;
                jg.style.top = ppy + "ppx";
            }
        }

        window.addEventListener("load", load)
    </script>
</head>

<body>
    <div id="jogador"></div>
</body>

</html>
